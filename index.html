<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de ZIP para NDS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Biblioteca JSZip para abrir arquivos .zip -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-md w-full bg-gray-800 rounded-xl shadow-2xl p-6 border border-gray-700">
        <h1 class="text-2xl font-bold text-center mb-2 text-indigo-400">Extrair ZIP para .nds</h1>
        <p class="text-gray-400 text-sm text-center mb-6">Envie seu arquivo `.zip` para extrair a ROM `.nds` de dentro dele.</p>

        <!-- Área de Upload -->
        <div class="mb-4">
            <label class="block w-full border-2 border-dashed border-gray-600 hover:border-indigo-500 rounded-lg p-6 text-center cursor-pointer transition bg-gray-900/50">
                <input type="file" id="zipFile" accept=".zip" class="hidden">
                <span id="fileName" class="text-gray-300 block text-sm">Clique aqui ou arraste o arquivo .zip</span>
            </label>
        </div>

        <!-- Botão de Ação -->
        <button onclick="extractNDS()" id="convertBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 rounded-lg transition shadow-lg disabled:opacity-50" disabled>
            Extrair e Baixar .nds
        </button>

        <!-- Status -->
        <div id="status" class="mt-4 text-center text-sm text-gray-400"></div>
    </div>

    <script>
        const fileInput = document.getElementById('zipFile');
        const fileNameSpan = document.getElementById('fileName');
        const convertBtn = document.getElementById('convertBtn');
        const statusDiv = document.getElementById('status');
        
        let selectedFile = null;

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                selectedFile = e.target.files[0];
                fileNameSpan.textContent = selectedFile.name;
                convertBtn.disabled = false;
                statusDiv.textContent = '';
            }
        });

        async function extractNDS() {
            if (!selectedFile) return;

            convertBtn.disabled = true;
            statusDiv.textContent = 'Lendo arquivo ZIP...';

            try {
                const zip = new JSZip();
                const zipContent = await zip.loadAsync(selectedFile);
                
                let ndsFileKey = null;
                let ndsFileName = '';

                // Procura por um arquivo .nds dentro do zip
                for (let filename of Object.keys(zipContent.files)) {
                    if (filename.toLowerCase().endsWith('.nds')) {
                        ndsFileKey = filename;
                        ndsFileName = filename.split('/').pop(); // Pega só o nome do arquivo
                        break;
                    }
                }

                if (!ndsFileKey) {
                    throw new Error('Nenhum arquivo .nds foi encontrado dentro deste ZIP.');
                }

                statusDiv.textContent = `Extraindo ${ndsFileName}...`;

                // Pega os dados binários reais do arquivo .nds de dentro do zip
                const ndsData = await zipContent.files[ndsFileKey].async('blob');

                // Baixa o arquivo .nds limpo
                const downloadUrl = URL.createObjectURL(ndsData);
                const a = document.createElement('a');
                a.href = downloadUrl;
                a.download = ndsFileName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);

                statusDiv.innerHTML = `<span class="text-green-400 font-semibold">Sucesso! O arquivo ${ndsFileName} foi extraído.</span>`;
            } catch (error) {
                statusDiv.innerHTML = `<span class="text-red-400">Erro: ${error.message}</span>`;
            } finally {
                convertBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
